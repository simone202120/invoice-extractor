[project]
name = "invoice-extractor"
version = "0.1.0"
description = "LangChain pipeline that turns invoices and receipts (PDF or text) into validated, structured JSON, with consistency checks and self-correcting retries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langfuse>=3",
    "openai>=1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=5",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not llm'"
markers = [
    "integration: needs real infrastructure (docker compose services)",
    "llm: calls a real LLM through OpenRouter (manual only)",
]

[tool.coverage.run]
source = ["src/invoice_extractor"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["invoice_extractor"]

[tool.deptry.per_rule_ignores]
# Used at runtime but never imported by our code: langchain by langfuse.langchain,
# python-multipart by FastAPI form parsing, uvicorn as the server command.
DEP002 = ["langchain", "python-multipart", "uvicorn"]
